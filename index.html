<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabata">
<title>Tabata Timer</title>
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#16202E; --muted:#5B6778; --line:#D9DEE6;
  --work:#2446E8; --work-ink:#FFFFFF; --rest:#BFE6D2; --rest-ink:#10382A; --prep:#F2C94C; --prep-ink:#33280A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#1B222C; --ink:#EEF2F7; --muted:#9AA6B5; --line:#2C3644;
    --work:#4C6BFF; --rest:#1F5A43; --rest-ink:#D5F3E4; --prep:#8A6D12; --prep-ink:#FFF2C4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#1B222C; --ink:#EEF2F7; --muted:#9AA6B5; --line:#2C3644;
  --work:#4C6BFF; --rest:#1F5A43; --rest-ink:#D5F3E4; --prep:#8A6D12; --prep-ink:#FFF2C4; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "SF Pro Rounded","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px;font-weight:700}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.stage{border-radius:28px;padding:22px 18px 18px;text-align:center;background:var(--surface);border:1px solid var(--line);transition:background .25s,color .25s}
.stage.work{background:var(--work);color:var(--work-ink);border-color:transparent}
.stage.rest{background:var(--rest);color:var(--rest-ink);border-color:transparent}
.stage.prep{background:var(--prep);color:var(--prep-ink);border-color:transparent}
.phase{font-size:22px;font-weight:700;min-height:28px}
.count{font-size:132px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:6px 0}
.sub{font-size:15px;opacity:.85;min-height:20px}
.bar{height:8px;border-radius:4px;background:rgba(127,127,127,.25);margin:16px 6px 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:currentColor;opacity:.9}
.controls{display:flex;gap:10px;margin-top:16px}
button{font:inherit;border:0;border-radius:16px;padding:14px 16px;font-weight:700;cursor:pointer;color:var(--ink);background:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--work);outline-offset:2px}
.primary{flex:2;background:var(--work);color:#fff}
.stage.work .primary{background:#fff;color:var(--work)}
.stage button.ghost{flex:1;background:rgba(127,127,127,.22);color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=number],input[type=text]{width:100%;font:inherit;font-size:17px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px}
.row input{flex:1}
.saved{list-style:none;margin:0;padding:0}
.saved li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.saved li:first-child{border-top:0}
.saved .load{flex:1;text-align:left;background:none;padding:6px 0;font-weight:600}
.saved small{display:block;color:var(--muted);font-weight:400}
.saved .del{background:none;color:var(--muted);padding:8px 10px}
.empty{color:var(--muted);margin:0}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 0}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Tabata timer</h1>

  <section class="stage" id="stage" aria-live="polite">
    <div class="phase" id="phase">Ready</div>
    <div class="count" id="count">20</div>
    <div class="sub" id="sub">8 rounds · 4 min</div>
    <div class="bar"><i id="fill"></i></div>
    <div class="controls">
      <button class="ghost" id="reset">Reset</button>
      <button class="primary" id="go">Start</button>
      <button class="ghost" id="skip">Skip</button>
    </div>
  </section>

  <section class="card" id="settings">
    <h2>Intervals</h2>
    <div class="grid">
      <div><label for="prep">Get ready</label><input id="prep" type="number" inputmode="numeric" min="0" max="60" value="10"></div>
      <div><label for="work">Work</label><input id="work" type="number" inputmode="numeric" min="1" max="600" value="20"></div>
      <div><label for="rest">Rest</label><input id="rest" type="number" inputmode="numeric" min="0" max="600" value="10"></div>
      <div><label for="rounds">Rounds</label><input id="rounds" type="number" inputmode="numeric" min="1" max="99" value="8"></div>
    </div>
    <div class="row">
      <input id="name" type="text" maxlength="30" placeholder="Name this workout" aria-label="Workout name">
      <button id="save">Save</button>
    </div>
    <p class="hint" id="msg">Seconds for each interval. Save up to 10 workouts.</p>
  </section>

  <section class="card">
    <h2>Saved workouts <span id="n" style="color:var(--muted);font-weight:400"></span></h2>
    <ul class="saved" id="list"></ul>
    <p class="empty" id="empty">No saved workouts yet. Set your intervals, name them, and tap Save.</p>
  </section>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var KEY = 'tabata.workouts.v1', MAX = 10;
  var phases = [], idx = 0, endAt = 0, remainMs = 0, timer = null, running = false, wake = null, ctx = null, lastBeep = -1;

  function val(id, d){ var v = parseInt($(id).value, 10); return isNaN(v) ? d : Math.max(0, v); }
  function cfg(){ return {prep: val('prep',10), work: Math.max(1,val('work',20)), rest: val('rest',10), rounds: Math.max(1,val('rounds',8))}; }
  function fmt(s){ var m = Math.floor(s/60), r = s%60; return m + ':' + (r<10?'0':'') + r; }

  function build(){
    var c = cfg(), p = [];
    if(c.prep>0) p.push({t:'prep', label:'Get ready', s:c.prep, round:0});
    for(var i=1;i<=c.rounds;i++){
      p.push({t:'work', label:'Work', s:c.work, round:i});
      if(c.rest>0 && i<c.rounds) p.push({t:'rest', label:'Rest', s:c.rest, round:i});
    }
    return p;
  }
  function totalSecs(){ return build().reduce(function(a,x){return a+x.s},0); }
  function idleSub(){ var c = cfg(); $('sub').textContent = c.rounds + ' rounds · ' + fmt(totalSecs()) + ' total'; }

  function show(ph, secs){
    var st = $('stage'); st.className = 'stage ' + ph.t;
    $('phase').textContent = ph.label;
    $('count').textContent = secs;
    $('sub').textContent = ph.round ? 'Round ' + ph.round + ' of ' + cfg().rounds : 'Starting soon';
    $('fill').style.width = (100 * (1 - secs/ph.s)) + '%';
  }

  function tone(freq, dur){
    try{
      if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur + 0.02);
    }catch(e){}
  }

  function audio(){
    if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function ding(){
    try{
      var a = audio(), t = a.currentTime;
      [[1318,0.5],[2636,0.18],[3951,0.08]].forEach(function(p){
        var o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.frequency.value = p[0];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(p[1], t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
        o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 1.35);
      });
    }catch(e){}
  }
  function whistle(){
    try{
      var a = audio(), t = a.currentTime;
      var o = a.createOscillator(), g = a.createGain();
      var lfo = a.createOscillator(), lg = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(2500, t);
      o.frequency.linearRampToValueAtTime(3000, t + 0.15);
      o.frequency.linearRampToValueAtTime(2900, t + 0.7);
      lfo.frequency.value = 32; lg.gain.value = 220;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.04);
      g.gain.setValueAtTime(0.35, t + 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      o.connect(g); g.connect(a.destination);
      o.start(t); lfo.start(t); o.stop(t + 0.85); lfo.stop(t + 0.85);
    }catch(e){}
  }

  async function lock(){ try{ if(navigator.wakeLock){ wake = await navigator.wakeLock.request('screen'); } }catch(e){} }
  function unlock(){ try{ if(wake){ wake.release(); wake = null; } }catch(e){} }
  document.addEventListener('visibilitychange', function(){ if(running && document.visibilityState === 'visible') lock(); });

  function startPhase(i){
    idx = i; var ph = phases[idx];
    remainMs = ph.s * 1000; endAt = Date.now() + remainMs; lastBeep = -1;
    show(ph, ph.s);
    if(ph.t === 'work') ding(); else if(ph.t === 'rest') whistle();
  }

  function tick(){
    var left = endAt - Date.now(), ph = phases[idx];
    if(left <= 0){
      if(idx + 1 >= phases.length){ finish(); return; }
      startPhase(idx + 1); return;
    }
    var secs = Math.ceil(left/1000);
    if(secs <= 3 && secs !== lastBeep){ lastBeep = secs; tone(660, 0.12); }
    show(ph, secs);
  }

  function finish(){
    stop();
    $('stage').className = 'stage';
    $('phase').textContent = 'Done';
    $('count').textContent = '✓';
    $('sub').textContent = 'Nice work. ' + cfg().rounds + ' rounds complete.';
    $('fill').style.width = '100%';
    $('go').textContent = 'Start';
    tone(880,0.2); setTimeout(function(){tone(1100,0.2)},220); setTimeout(function(){tone(1320,0.4)},440);
    idx = 0; phases = [];
  }

  function stop(){ running = false; clearInterval(timer); timer = null; unlock(); try{ if(keep) keep.pause(); }catch(e){} }

  var keep = null;
  var BYPASS_SILENT = false; // true = plays even on silent switch, but pauses Spotify
  function unlockAudio(){
    try{
      var a = audio();
      try{ if(navigator.audioSession) navigator.audioSession.type = BYPASS_SILENT ? 'playback' : 'ambient'; }catch(e){}
      var b = a.createBuffer(1, 1, 22050), s = a.createBufferSource();
      s.buffer = b; s.connect(a.destination); s.start(0);
      if(BYPASS_SILENT && !keep){
        var n = 8000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
        function w(o, str){ for(var i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); }
        w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt ');
        v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
        v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
        w(36,'data'); v.setUint32(40,n,true);
        for(var i=0;i<n;i++) v.setUint8(44+i,128);
        keep = new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));
        keep.loop = true; keep.volume = 0.01;
      }
      if(keep){ var p = keep.play(); if(p && p.catch) p.catch(function(){}); }
    }catch(e){}
  }

  function start(){
    unlockAudio();
    if(!phases.length){ phases = build(); startPhase(0); }
    else { endAt = Date.now() + remainMs; }
    running = true; $('go').textContent = 'Pause'; lock();
    clearInterval(timer); timer = setInterval(tick, 100); tick();
  }
  function pause(){ remainMs = Math.max(0, endAt - Date.now()); stop(); $('go').textContent = 'Resume'; }
  function reset(){
    stop(); phases = []; idx = 0; $('go').textContent = 'Start';
    $('stage').className = 'stage'; $('phase').textContent = 'Ready';
    $('count').textContent = cfg().work; $('fill').style.width = '0'; idleSub();
  }

  $('go').onclick = function(){ if(running) pause(); else start(); };
  $('reset').onclick = reset;
  $('skip').onclick = function(){
    if(!phases.length) return;
    if(idx + 1 >= phases.length){ finish(); return; }
    startPhase(idx + 1); if(!running){ running = true; $('go').textContent = 'Pause'; lock(); timer = setInterval(tick,100); }
  };
  ['prep','work','rest','rounds'].forEach(function(id){
    $(id).addEventListener('input', function(){ if(!running && !phases.length){ $('count').textContent = cfg().work; idleSub(); } });
  });

  /* saved workouts */
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return mem; } }
  var mem = [];
  function store(list){ mem = list; try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){} }
  function say(t){ $('msg').textContent = t; }

  function render(){
    var list = load(), ul = $('list'); ul.innerHTML = '';
    $('n').textContent = '(' + list.length + '/' + MAX + ')';
    $('empty').classList.toggle('hidden', list.length > 0);
    list.forEach(function(w, i){
      var li = document.createElement('li');
      var b = document.createElement('button'); b.className = 'load';
      var nm = document.createElement('span'); nm.textContent = w.name;
      var sm = document.createElement('small');
      sm.textContent = w.work + 's work, ' + w.rest + 's rest, ' + w.rounds + ' rounds';
      b.appendChild(nm); b.appendChild(sm);
      b.onclick = function(){
        stop(); phases = [];
        $('prep').value = w.prep; $('work').value = w.work; $('rest').value = w.rest; $('rounds').value = w.rounds;
        $('name').value = w.name; reset(); say('Loaded ' + w.name + '.'); window.scrollTo({top:0,behavior:'smooth'});
      };
      var d = document.createElement('button'); d.className = 'del'; d.textContent = 'Delete';
      d.setAttribute('aria-label', 'Delete ' + w.name);
      d.onclick = function(){ var l = load(); l.splice(i,1); store(l); render(); say('Deleted ' + w.name + '.'); };
      li.appendChild(b); li.appendChild(d); ul.appendChild(li);
    });
  }

  $('save').onclick = function(){
    var name = $('name').value.trim(), c = cfg();
    if(!name){ say('Add a name first.'); $('name').focus(); return; }
    var l = load(), at = -1;
    l.forEach(function(w,i){ if(w.name.toLowerCase() === name.toLowerCase()) at = i; });
    var w = {name:name, prep:c.prep, work:c.work, rest:c.rest, rounds:c.rounds};
    if(at >= 0){ l[at] = w; say('Updated ' + name + '.'); }
    else if(l.length >= MAX){ say('You have 10 saved. Delete one to add another.'); return; }
    else { l.push(w); say('Saved ' + name + '.'); }
    store(l); render();
  };

  render(); reset();
})();
</script>
</body>
</html>
